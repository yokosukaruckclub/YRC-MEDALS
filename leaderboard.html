<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yokosuka Ruck Club 10K Leaderboard</title>

<style>

body {
  margin: 0;
  padding: 20px;
  background: #111;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
}

h1 {
  margin: 0 0 5px;
  font-size: 32px;
}

.subtitle {
  color: #bbb;
  margin-bottom: 25px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.stat {
  background: #222;
  border: 1px solid #444;
  border-radius: 10px;
  padding: 15px 25px;
  min-width: 160px;
}

.stat-number {
  font-size: 28px;
  font-weight: bold;
}

.stat-label {
  color: #aaa;
  font-size: 13px;
  margin-top: 5px;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.tab {
  background: #333;
  color: #fff;
  border: 1px solid #555;
  border-radius: 8px;
  padding: 12px 22px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
}

  .event-tab {
  background: #333;
  color: #fff;
  border: 1px solid #555;
  border-radius: 8px;
  padding: 12px 22px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
}

.event-tab.active {
  background: #777;
}

.tab.active {
  background: #777;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 10px;
}

table {
  width: 100%;
  min-width: 650px;
  border-collapse: collapse;
  background: #1b1b1b;
}

th {
  background: #333;
  padding: 12px 8px;
  font-size: 13px;
  white-space: nowrap;
}

td {
  padding: 12px 8px;
  border-bottom: 1px solid #333;
  font-size: 14px;
  white-space: nowrap;
}

tr:last-child td {
  border-bottom: none;
}

.rank {
  font-weight: bold;
}

.medal-link {
  color: #fff;
  text-decoration: none;
  background: #555;
  padding: 6px 10px;
  border-radius: 6px;
  display: inline-block;
}

.medal-link:hover {
  background: #777;
}

.loading {
  color: #aaa;
  padding: 30px;
}

.error {
  color: #ff7777;
  padding: 30px;
}

.footer {
  margin-top: 30px;
  color: #777;
  font-size: 12px;
}

@media (max-width: 600px) {

  body {
    padding: 15px 10px;
  }

  h1 {
    font-size: 25px;
  }

  .subtitle {
    font-size: 14px;
    margin-bottom: 20px;
  }

  .stats {
    gap: 8px;
  }

  .stat {
    min-width: 90px;
    padding: 12px 10px;
    flex: 1;
  }

  .stat-number {
    font-size: 21px;
  }

  .stat-label {
    font-size: 10px;
  }

  .tab {
    padding: 10px 14px;
    font-size: 12px;
  }

  th,
  td {
    padding: 10px 8px;
  }

}

</style>
</head>

<body>

<div class="container">

<h1>YOKOSUKA RUCK CLUB</h1>

<div class="subtitle">
RUCK LEADERBOARD

</div>

<div class="stats">

  <div class="stat">
    <div class="stat-number" id="verifiedCount">0</div>
    <div class="stat-label">VERIFIED FINISHERS</div>
  </div>

  <div class="stat">
    <div class="stat-number" id="fastestTime">--:--:--</div>
    <div class="stat-label">FASTEST TIME</div>
  </div>

  <div class="stat">
    <div class="stat-number" id="heaviestRuck">-- LB</div>
    <div class="stat-label">HEAVIEST RUCK</div>
  </div>

</div>

<div class="tabs">
<div id="eventSelector" style="margin-bottom: 15px;">
  <button class="event-tab active" onclick="showEvent('all', this)">ALL EVENTS</button>
  <button class="event-tab" onclick="showEvent('YRC 5K RUCK', this)">YRC 5K</button>
  <button class="event-tab" onclick="showEvent('YRC 10K RUCK', this)">YRC 10K</button>
</div>
  <button class="tab active" onclick="showDivision('overall', this)">
    OVERALL
  </button>

  <button class="tab" onclick="showDivision('standard', this)">
    20 LB
  </button>

  <button class="tab" onclick="showDivision('heavy', this)">
    HEAVY
  </button>

</div>

<div class="table-wrap">

<table>

<thead>
<tr>
  <th>RANK</th>
  <th>FINISHER</th>
  <th>TIME</th>
  <th>WEIGHT</th>
  <th>DISTANCE</th>
  <th>MEDAL</th>
</tr>
</thead>

<tbody id="leaderboardBody">

<tr>
  <td colspan="6" class="loading">
    Loading verified finishers...
  </td>
</tr>

</tbody>

</table>

</div>

<div class="footer">
Yokosuka Ruck Club • Verified Finisher Leaderboard
</div>

</div>

<script>

/*
  YRC 10K LEADERBOARD

  Data source:
  GitHub raw data.json
*/

const dataUrl =
  "https://raw.githubusercontent.com/yokosukaruckclub/YRC-MEDALS/main/data.json";

const medalBaseUrl =
  "https://yokosukaruckclub.github.io/YRC-MEDALS/";

let finishers = [];
let currentDivision = "overall";
let currentEvent = "all";

function getInitials(name) {

  const parts = String(name || "")
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  if (parts.length === 0) {
    return "--";
  }

  if (parts.length === 1) {
    return parts[0]
      .substring(0, 2)
      .toUpperCase();
  }

  return (
  parts[0].charAt(0).toUpperCase() +
  ". " +
  parts[parts.length - 1]
);
}


function parseTime(time) {

  if (typeof time === "number") {
    return Number.isFinite(time) ? time : NaN;
  }

  const value = String(time || "").trim();

  if (!value) {
    return NaN;
  }

  const parts = value.split(":");

  if (parts.length === 3) {

    const hours = Number(parts[0]);
    const minutes = Number(parts[1]);
    const seconds = Number(parts[2]);

    if (
      Number.isFinite(hours) &&
      Number.isFinite(minutes) &&
      Number.isFinite(seconds)
    ) {
      return (
        hours * 3600 +
        minutes * 60 +
        seconds
      );
    }
  }

  if (parts.length === 2) {

    const minutes = Number(parts[0]);
    const seconds = Number(parts[1]);

    if (
      Number.isFinite(minutes) &&
      Number.isFinite(seconds)
    ) {
      return (
        minutes * 60 +
        seconds
      );
    }
  }

  return NaN;
}


function parseWeight(weight) {

  const number = parseFloat(
    String(weight || "")
      .replace(/[^\d.]/g, "")
  );

  return Number.isFinite(number)
    ? number
    : 0;
}


function parseDistance(distance) {

  const number = parseFloat(
    String(distance || "")
      .replace(/[^\d.]/g, "")
  );

  return Number.isFinite(number)
    ? number
    : 0;
}


function formatTime(time) {

  const totalSeconds = parseTime(time);

  if (!Number.isFinite(totalSeconds)) {
    return "--:--:--";
  }

  const hours =
    Math.floor(totalSeconds / 3600);

  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );

  const seconds =
    Math.floor(totalSeconds % 60);

  return (
    String(hours).padStart(2, "0") +
    ":" +
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0")
  );
}


function getDivisionRecords() {
const eventRecords =
    currentEvent === "all"
      ? finishers.slice()
      : finishers.filter(function(record) {
          return String(record.event || "")
            .trim()
            .toUpperCase() === currentEvent;
        });
  if (currentDivision === "overall") {
  return eventRecords.slice();

  }

  if (currentDivision === "standard") {

    return eventRecords.filter(function(record) {


      const weight =
        parseWeight(record.weight);

      return (
        weight >= 20 &&
        weight <= 40
      );

    });
  }

  if (currentDivision === "heavy") {

  return eventRecords.filter(function(record) {

      const weight =
        parseWeight(record.weight);

      return weight > 40;

    });
  }

  return [];
}


function renderLeaderboard() {

  const body =
    document.getElementById(
      "leaderboardBody"
    );

  const records =
    getDivisionRecords();

  records.sort(function(a, b) {

    const timeA =
      parseTime(a.time);

    const timeB =
      parseTime(b.time);

    if (
      !Number.isFinite(timeA) &&
      !Number.isFinite(timeB)
    ) {
      return 0;
    }

    if (!Number.isFinite(timeA)) {
      return 1;
    }

    if (!Number.isFinite(timeB)) {
      return -1;
    }

    return timeA - timeB;

  });


  if (records.length === 0) {

    body.innerHTML =
      '<tr>' +
      '<td colspan="6" class="loading">' +
      'No verified finishers in this division yet.' +
      '</td>' +
      '</tr>';

    return;
  }


  body.innerHTML = "";


  records.forEach(function(record, index) {

    const medalId =
      String(record.medalId || "")
        .trim();

    const medalUrl =
      medalBaseUrl +
      "?id=" +
      encodeURIComponent(medalId);

    const row =
      document.createElement("tr");


    const timeDisplay =
      formatTime(record.time);

    const weightNumber =
      parseWeight(record.weight);

    const distanceNumber =
      parseDistance(record.distance);


    const rankCell =
      document.createElement("td");

    rankCell.className = "rank";
    rankCell.textContent =
      index + 1;


    const finisherCell =
      document.createElement("td");

    finisherCell.textContent =
      getInitials(record.name);


    const timeCell =
      document.createElement("td");

    timeCell.textContent =
      timeDisplay;


    const weightCell =
      document.createElement("td");

    weightCell.textContent =
      weightNumber > 0
        ? weightNumber.toFixed(0) + " LB"
        : "--";


    const distanceCell =
      document.createElement("td");

    distanceCell.textContent =
      distanceNumber > 0
        ? distanceNumber.toFixed(2) + " KM"
        : "--";


    const medalCell =
      document.createElement("td");


    if (medalId) {

      const link =
        document.createElement("a");

      link.className =
        "medal-link";

      link.href =
        medalUrl;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

      link.textContent =
        "VERIFY";

      medalCell.appendChild(link);

    } else {

      medalCell.textContent =
        "--";

    }


    row.appendChild(rankCell);
    row.appendChild(finisherCell);
    row.appendChild(timeCell);
    row.appendChild(weightCell);
    row.appendChild(distanceCell);
    row.appendChild(medalCell);

    body.appendChild(row);

  });

}


function showEvent(eventName, button) {
  currentEvent = eventName;
const subtitle = document.querySelector(".subtitle");

subtitle.textContent =
  currentEvent === "all"
    ? "RUCK LEADERBOARD"
    : currentEvent === "YRC 5K RUCK"
      ? "5K RUCK LEADERBOARD"
      : "10K RUCK LEADERBOARD";
  document.querySelectorAll(".event-tab").forEach(function(tab) {
    tab.classList.remove("active");
  });

  button.classList.add("active");

  updateStats();
  renderLeaderboard();
}

  function showDivision(
  division,
  button
) {

  currentDivision =
    division;

  document
    .querySelectorAll(".tab")
    .forEach(function(tab) {

      tab.classList.remove(
        "active"
      );

    });

  button.classList.add(
    "active"
  );

  renderLeaderboard();

}


function updateStats() {

  const count =
    finishers.length;

  document
    .getElementById(
      "verifiedCount"
    )
    .textContent =
    count;


  if (count === 0) {

    document
      .getElementById(
        "fastestTime"
      )
      .textContent =
      "--:--:--";

    document
      .getElementById(
        "heaviestRuck"
      )
      .textContent =
      "-- LB";

    return;
  }


  const validTimes =
    finishers
      .map(function(record) {

        return parseTime(
          record.time
        );

      })
      .filter(function(time) {

        return Number.isFinite(
          time
        );

      });


  if (validTimes.length > 0) {

    const fastest =
      Math.min.apply(
        null,
        validTimes
      );

    document
      .getElementById(
        "fastestTime"
      )
      .textContent =
      formatTime(fastest);

  } else {

    document
      .getElementById(
        "fastestTime"
      )
      .textContent =
      "--:--:--";

  }


  const weights =
    finishers
      .map(function(record) {

        return parseWeight(
          record.weight
        );

      })
      .filter(function(weight) {

        return weight > 0;

      });


  if (weights.length > 0) {

    const heaviest =
      Math.max.apply(
        null,
        weights
      );

    document
      .getElementById(
        "heaviestRuck"
      )
      .textContent =
      heaviest.toFixed(0) +
      " LB";

  } else {

    document
      .getElementById(
        "heaviestRuck"
      )
      .textContent =
      "-- LB";

  }

}


function loadLeaderboard() {

  const body =
    document.getElementById(
      "leaderboardBody"
    );

  body.innerHTML =
    '<tr>' +
    '<td colspan="6" class="loading">' +
    'Loading verified finishers...' +
    '</td>' +
    '</tr>';


  fetch(
    dataUrl +
    "?v=" +
    Date.now(),
    {
      cache: "no-store"
    }
  )

  .then(function(response) {

    if (!response.ok) {
      throw new Error(
        "HTTP " +
        response.status
      );
    }

    return response.json();

  })

  .then(function(records) {

    if (!Array.isArray(records)) {
      throw new Error(
        "Invalid data format"
      );
    }


    finishers =
      records.filter(function(record) {

        return currentEvent === "all" ||
  String(record.event || "")
    .trim()
    .toUpperCase() === currentEvent;

      });


    updateStats();
    renderLeaderboard();

  })

  .catch(function(error) {

    console.error(
      "Leaderboard error:",
      error
    );


    document
      .getElementById(
        "verifiedCount"
      )
      .textContent =
      "0";

    document
      .getElementById(
        "fastestTime"
      )
      .textContent =
      "--:--:--";

    document
      .getElementById(
        "heaviestRuck"
      )
      .textContent =
      "-- LB";


    body.innerHTML =
      '<tr>' +
      '<td colspan="6" class="error">' +
      'Unable to load leaderboard data.' +
      '</td>' +
      '</tr>';

  });

}


loadLeaderboard();

</script>

</body>
</html>
