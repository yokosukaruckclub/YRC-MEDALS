function getInitials(name) {

  const parts = String(name || "")
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  if (parts.length === 0) {
    return "—";
  }

  if (parts.length === 1) {
    return parts[0].substring(0, 2).toUpperCase();
  }

  return (
    parts[0].charAt(0) +
    parts[parts.length - 1].charAt(0)
  ).toUpperCase();
}


function parseTime(time) {

  const parts = String(time || "")
    .trim()
    .split(":")
    .map(Number);

  if (parts.some(isNaN)) {
    return Infinity;
  }

  if (parts.length === 3) {
    return (
      parts[0] * 3600 +
      parts[1] * 60 +
      parts[2]
    );
  }

  if (parts.length === 2) {
    return (
      parts[0] * 60 +
      parts[1]
    );
  }

  return Infinity;
}


function parseWeight(weight) {

  const number = parseFloat(
    String(weight || "").replace(/[^\d.]/g, "")
  );

  return isNaN(number) ? 0 : number;
}
