<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yokosuka Ruck Club 10K Leaderboard</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #111;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
}

h1 {
  margin-bottom: 5px;
  font-size: 32px;
}

.subtitle {
  color: #bbb;
  margin-bottom: 25px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.stat {
  background: #222;
  border: 1px solid #444;
  border-radius: 10px;
  padding: 15px 25px;
  min-width: 160px;
}

.stat-number {
  font-size: 28px;
  font-weight: bold;
}

.stat-label {
  color: #aaa;
  font-size: 13px;
  margin-top: 5px;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.tab {
  background: #333;
  color: #fff;
  border: 1px solid #555;
  border-radius: 8px;
  padding: 12px 22px;
  cursor: pointer;
  font-weight: bold;
}

.tab.active {
  background: #777;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #1b1b1b;
  border-radius: 10px;
  overflow: hidden;
}

th {
  background: #333;
  padding: 12px 8px;
  font-size: 13px;
}

td {
  padding: 12px 8px;
  border-bottom: 1px solid #333;
  font-size: 14px;
}

tr:last-child td {
  border-bottom: none;
}

.rank {
  font-weight: bold;
}

.medal-link {
  color: #fff;
  text-decoration: none;
  background: #555;
  padding: 6px 10px;
  border-radius: 6px;
  display: inline-block;
}

.medal-link:hover {
  background: #777;
}

.loading {
  color: #aaa;
  padding: 30px;
}

.error {
  color: #ff7777;
  padding: 30px;
}

.footer {
  margin-top: 30px;
  color: #777;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>YOKOSUKA RUCK CLUB</h1>

<div class="subtitle">
10K RUCK LEADERBOARD
</div>

<div class="stats">

  <div class="stat">
    <div class="stat-number" id="verifiedCount">0</div>
    <div class="stat-label">VERIFIED FINISHERS</div>
  </div>

  <div class="stat">
    <div class="stat-number" id="fastestTime">--:--:--</div>
    <div class="stat-label">FASTEST TIME</div>
  </div>

  <div class="stat">
    <div class="stat-number" id="heaviestRuck">-- LB</div>
    <div class="stat-label">HEAVIE
