<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yokosuka Ruck Club | Medal Verification</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at top, #26313b 0%, #11161b 45%, #080b0e 100%);
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
  }

  .card {
    width: 100%;
    max-width: 600px;
    background: rgba(20, 25, 30, 0.96);
    border: 1px solid #59616a;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 15px 50px rgba(0,0,0,.55);
  }

  .header {
    text-align: center;
    padding: 32px 20px 22px;
    background: linear-gradient(180deg, #1c252d, #11161b);
  }

  .club {
    font-size: 14px;
    letter-spacing: 3px;
    color: #d6d6d6;
    font-weight: bold;
  }

  .verified {
    margin-top: 16px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
  }

  .check {
    color: #42d978;
  }

  .body {
    padding: 30px 25px 35px;
    text-align: center;
  }

  .name {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .event {
    font-size: 18px;
    color: #d0d0d0;
    margin-bottom: 25px;
  }

  .line {
    height: 1px;
    background: #444b52;
    margin: 20px 0 25px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }

  .stat {
    background: #252c32;
    border-radius: 10px;
    padding: 17px 10px;
  }

  .label {
    font-size: 12px;
    color: #aeb5bb;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 7px;
  }

  .value {
    font-size: 20px;
    font-weight: bold;
  }

  .date {
    margin-top: 18px;
    background: #252c32;
    border-radius: 10px;
    padding: 17px;
  }

  .medal {
    margin-top: 25px;
    padding: 14px;
    border: 1px solid #626970;
    border-radius: 10px;
    background: #171c21;
  }

  .medal-label {
    font-size: 11px;
    color: #999;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .medal-id {
    margin-top: 6px;
    font-size: 16px;
    font-weight: bold;
    word-break: break-word;
  }

  .footer {
    text-align: center;
    padding: 18px;
    font-size: 12px;
    color: #888f95;
    background: #0d1115;
  }

  .error {
    text-align: center;
    padding: 45px 25px;
  }

  .error h1 {
    font-size: 25px;
  }

  @media (max-width: 450px) {
    .verified {
      font-size: 23px;
    }

    .name {
      font-size: 27px;
    }

    .stats {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<div class="card" id="verificationCard"></div>

<script>

const finishers = {

  "YRC-10K-2026-0006": {
    name: "HOLDEN FABER",
    event: "YRC 10K Ruck",
    distance: "10.50 KM",
    weight: "20 LB",
    time: "01:30:00",
    date: "October 6, 2026"
  }

};


function showVerification() {

  const params = new URLSearchParams(window.location.search);
  const medalId = params.get("id");

  const card = document.getElementById("verificationCard");

  if (!medalId || !finishers[medalId]) {

    card.innerHTML = `
      <div class="header">
        <div class="club">YOKOSUKA RUCK CLUB</div>
      </div>

      <div class="error">
        <h1>❌ Medal Not Verified</h1>
        <p>
          The medal ID could not be verified.
        </p>
      </div>

      <div class="footer">
        Yokosuka Ruck Club
      </div>
    `;

    return;
  }

  const finisher = finishers[medalId];

  card.innerHTML = `

    <div class="header">

      <div class="club">
        YOKOSUKA RUCK CLUB
      </div>

      <div class="verified">
        <span class="check">✓</span>
        VERIFIED FINISHER
      </div>

    </div>


    <div class="body">

      <div class="name">
        ${finisher.name}
      </div>

      <div class="event">
        ${finisher.event}
      </div>

      <div class="line"></div>


      <div class="stats">

        <div class="stat">
          <div class="label">Distance</div>
          <div class="value">${finisher.distance}</div>
        </div>

        <div class="stat">
          <div class="label">Ruck Weight</div>
          <div class="value">${finisher.weight}</div>
        </div>

        <div class="stat">
          <div class="label">Finish Time</div>
          <div class="value">${finisher.time}</div>
        </div>

        <div class="stat">
          <div class="label">Completion Date</div>
          <div class="value">${finisher.date}</div>
        </div>

      </div>


      <div class="medal">

        <div class="medal-label">
          Medal ID
        </div>

        <div class="medal-id">
          ${medalId}
        </div>

      </div>

    </div>


    <div class="footer">
      This digital medal has been verified by<br>
      <strong>Yokosuka Ruck Club</strong>
    </div>

  `;
}


showVerification();

</script>

</body>
</html>
