<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yokosuka Ruck Club | Medal Verification</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #0b1424;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 620px;
  background: #111c2e;
  border: 1px solid #53627a;
  border-radius: 22px;
  padding: 32px 24px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,.35);
}

.club {
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 3px;
  color: #ffffff;
  margin-bottom: 20px;
}

.title {
  font-size: 14px;
  letter-spacing: 2px;
  color: #b8c2d1;
  margin-bottom: 28px;
}

.loading {
  color: #d7dde7;
  font-size: 18px;
  padding: 35px 10px;
}

.verified {
  color: #65d391;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 18px;
}

.name {
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 10px;
}

.event {
  font-size: 18px;
  color: #d0d7e2;
  margin-bottom: 28px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 10px;
}

.box {
  background: #0b1424;
  border: 1px solid #35445b;
  border-radius: 12px;
  padding: 18px 10px;
}

.label {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: #9da9ba;
  margin-bottom: 8px;
}

.value {
  font-size: 18px;
  font-weight: bold;
}

.medal-id {
  margin-top: 24px;
  padding: 14px;
  border: 1px solid #35445b;
  border-radius: 10px;
  font-size: 14px;
  color: #dbe2ec;
  letter-spacing: 1px;
}

.footer {
  margin-top: 24px;
  color: #8995a7;
  font-size: 12px;
  line-height: 1.6;
}

.error {
  color: #ff9d9d;
  font-size: 18px;
  line-height: 1.5;
  padding: 25px 10px;
}

.error-id {
  font-weight: bold;
  color: #ffffff;
  margin-top: 10px;
}

@media (max-width: 500px) {
  .card {
    padding: 28px 18px;
  }

  .name {
    font-size: 27px;
  }

  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="card" id="verificationCard">

  <div class="club">
    YOKOSUKA RUCK CLUB
  </div>

  <div class="title">
    DIGITAL MEDAL VERIFICATION
  </div>

  <div class="loading">
    Verifying YRC finisher...
  </div>

</div>

<script>

const SHEET_ID =
  "2PACX-1vSiR8BrRCuLcHm5x3PLy4_aSIFSB6rfgx53eTJylBvGlJkTqRTYzO5Qoc7MIPIcg2LBe_kDS3Pxyt0u";

const SHEET_GID = "1167424338";

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getMedalId() {
  const params = new URLSearchParams(window.location.search);
  return (params.get("id") || "").trim().toUpperCase();
}

window.yrcVerificationCallback = function(data) {

  const medalId = getMedalId();
  const card = document.getElementById("verificationCard");

  if (!card) return;

  if (!medalId) {

    card.innerHTML = `
      <div class="club">YOKOSUKA RUCK CLUB</div>
      <div class="error">
        No medal ID was provided.
      </div>
    `;

    return;
  }

  try {

    const rows = data.table.rows || [];

    let match = null;

    for (const row of rows) {

      const cells = row.c || [];

      const values = cells.map(function(cell) {
        return cell && cell.v !== undefined ? cell.v : "";
      });

      if (
        String(values[0] || "")
          .trim()
          .toUpperCase() === medalId
      ) {

        match = values;
        break;
      }
    }

    if (!match) {

      card.innerHTML = `
        <div class="club">
          YOKOSUKA RUCK CLUB
        </div>

        <div class="error">
          <strong>MEDAL NOT FOUND</strong>

          <div class="error-id">
            ${escapeHTML(medalId)}
          </div>
        </div>
      `;

      return;
    }

    const name = match[1] || "";
    const event = match[2] || "";
    const distance = match[3] || "";
    const weight = match[4] || "";
    const time = match[5] || "";
    const date = match[6] || "";

    card.innerHTML = `

      <div class="club">
        YOKOSUKA RUCK CLUB
      </div>

      <div class="verified">
        ✓ VERIFIED FINISHER
      </div>

      <div class="name">
        ${escapeHTML(name)}
      </div>

      <div class="event">
        ${escapeHTML(event)}
      </div>

      <div class="grid">

        <div class="box">
          <div class="label">DISTANCE</div>
          <div class="value">
            ${escapeHTML(distance)}
          </div>
        </div>

        <div class="box">
          <div class="label">RUCK WEIGHT</div>
          <div class="value">
            ${escapeHTML(weight)}
          </div>
        </div>

        <div class="box">
          <div class="label">FINISH TIME</div>
          <div class="value">
            ${escapeHTML(time)}
          </div>
        </div>

        <div class="box">
          <div class="label">COMPLETION DATE</div>
          <div class="value">
            ${escapeHTML(date)}
          </div>
        </div>

      </div>

      <div class="medal-id">
        MEDAL ID: ${escapeHTML(match[0])}
      </div>

      <div class="footer">
        This digital medal has been verified by<br>
        Yokosuka Ruck Club.
      </div>
    `;

  } catch (error) {

    card.innerHTML = `
      <div class="club">
        YOKOSUKA RUCK CLUB
      </div>

      <div class="error">
        Unable to process the verification data.
      </div>
    `;
  }
};

function loadVerificationData() {

  const script = document.createElement("script");

  script.src =
    "https://docs.google.com/spreadsheets/d/e/" +
    SHEET_ID +
    "/pub?gid=" +
    SHEET_GID +
    "&output=javascript&callback=yrcVerificationCallback";

  script.onerror = function() {

    const card =
      document.getElementById("verificationCard");

    if (card) {

      card.innerHTML = `
        <div class="club">
          YOKOSUKA RUCK CLUB
        </div>

        <div class="error">
          Unable to connect to the YRC verification database.
        </div>
      `;
    }
  };

  document.head.appendChild(script);
}

document.addEventListener("DOMContentLoaded", function() {
  loadVerificationData();
});

</script>

</body>
</html>
