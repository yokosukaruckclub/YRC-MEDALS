<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yokosuka Ruck Club - Medal Verification</title>

<style>

body {
  margin: 0;
  padding: 30px 15px;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
}

.card {
  max-width: 650px;
  margin: auto;
  background: linear-gradient(145deg, #182333, #0d1420);
  border: 1px solid #64748b;
  border-radius: 18px;
  padding: 30px;
  box-sizing: border-box;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,.45);
}

.club {
  letter-spacing: 4px;
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 30px;
}

.verified {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 30px;
}

.check {
  color: #4ade80;
}

.name {
  font-size: 32px;
  font-weight: bold;
  
  margin-bottom: 8px;
}

.event {
  font-size: 18px;
  margin-bottom: 25px;
  color: #d1d5db;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.box {
  background: rgba(100,116,139,.45);
  border-radius: 12px;
  padding: 18px 10px;
}

.label {
  font-size: 12px;
  letter-spacing: 1px;
  color: #e5e7eb;
  margin-bottom: 8px;
}

.value {
  font-size: 20px;
  font-weight: bold;
}

.medal-id {
  margin-top: 18px;
  padding: 16px;
  border: 1px solid #94a3b8;
  border-radius: 12px;
  font-weight: bold;
}

.footer {
  margin-top: 30px;
  color: #9ca3af;
  font-size: 12px;
}

.error {
  color: #fca5a5;
  font-size: 18px;
  line-height: 1.5;
}

.loading {
  color: #d1d5db;
  font-size: 18px;
}

</style>
</head>


<body>

<div class="card" id="verificationCard">

  <div class="loading">
    Verifying YRC finisher...
  </div>

</div>


<script>


const SHEET_ID =
  "1X4VSwR69uf9u9FGeP-QSiaID_XZ4GXyywq_KMbwM3vI";

const SHEET_GID = "1167424338";

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getMedalId() {
  const params = new URLSearchParams(window.location.search);
  return (params.get("id") || "").trim().toUpperCase();
}

window.yrcVerificationCallback = function(data) {
  const medalId = getMedalId();
  const card = document.getElementById("verificationCard");

  if (!card) return;

  if (!medalId) {
    card.innerHTML = `
      <div class="error">
        No medal ID was provided.
      </div>
    `;
    return;
  }

  try {
    const rows = data.table.rows || [];

    let match = null;

    for (const row of rows) {
      const cells = row.c || [];
      const values = cells.map(cell =>
        cell && cell.v !== undefined ? cell.v : ""
      );

      if (
        String(values[0] || "")
          .trim()
          .toUpperCase() === medalId
      ) {
        match = values;
        break;
      }
    }

    if (!match) {
      card.innerHTML = `
        <div class="error">
          <div style="font-size:28px;font-weight:bold;margin-bottom:10px;">
            MEDAL NOT FOUND
          </div>
          <div>
            No verified YRC medal was found for:
          </div>
          <div style="font-weight:bold;margin-top:8px;">
            ${escapeHTML(medalId)}
          </div>
        </div>
      `;
      return;
    }

    const name = match[1] || "";
    const event = match[2] || "";
    const distance = match[3] || "";
    const weight = match[4] || "";
    const time = match[5] || "";
    const date = match[6] || "";

    card.innerHTML = `
      <div class="club">
        YOKOSUKA RUCK CLUB
      </div>

      <div class="verified">
        ✓ VERIFIED FINISHER
      </div>

      <div class="name">
        ${escapeHTML(name)}
      </div>

      <div class="event">
        ${escapeHTML(event)}
      </div>

      <div class="grid">

        <div class="box">
          <div class="label">DISTANCE</div>
          <div class="value">${escapeHTML(distance)}</div>
        </div>

        <div class="box">
          <div class="label">RUCK WEIGHT</div>
          <div class="value">${escapeHTML(weight)}</div>
        </div>

        <div class="box">
          <div class="label">FINISH TIME</div>
          <div class="value">${escapeHTML(time)}</div>
        </div>

        <div class="box">
          <div class="label">COMPLETION DATE</div>
          <div class="value">${escapeHTML(date)}</div>
        </div>

      </div>

      <div class="medal-id">
        MEDAL ID: ${escapeHTML(match[0])}
      </div>

      <div class="footer">
        This medal has been verified by<br>
        Yokosuka Ruck Club.
      </div>
    `;

  } catch (error) {
    card.innerHTML = `
      <div class="error">
        Unable to verify this medal.
      </div>
    `;
  }
};

function loadVerificationData() {
  const script = document.createElement("script");

  script.src =
    "https://docs.google.com/spreadsheets/d/" +
    SHEET_ID +
    "/gviz/tq?gid=" +
    SHEET_GID +
    "&tqx=responseHandler:yrcVerificationCallback";

  script.onerror = function() {
    const card = document.getElementById("verificationCard");

    if (card) {
      card.innerHTML = `
        <div class="error">
          Unable to connect to the YRC verification database.
        </div>
      `;
    }
  };

  document.head.appendChild(script);
}

document.addEventListener("DOMContentLoaded", function() {
  loadVerificationData();
});


</script>

</body>
</html>
